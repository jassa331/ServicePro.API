name: Manual DB Sync (Extract + Save)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-db:
    runs-on: windows-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Install SQLPackage
      run: |
        choco install sqlpackage -y

    - name: Extract DB to DACPAC
      run: |
        sqlpackage /Action:Extract /SourceConnectionString:"${{ secrets.DB_CONNECTION_STRING }}" /TargetFile:database/scripts/output.dacpac

    # ❗ ONLY THIS STEP (NO git push)
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        commit-message: Auto DB Backup - DACPAC
        title: Auto DB Sync
        body: Automated database backup update
        branch: db-sync-branch
        base: master
