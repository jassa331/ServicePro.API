name: Manual DB Sync (Extract + Save)

on:
  workflow_dispatch:

jobs:
  sync-db:
    runs-on: windows-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Install SQLPackage
      run: |
        choco install sqlpackage -y

    - name: Extract DB to DACPAC
      run: |
        sqlpackage /Action:Extract /SourceConnectionString:"${{ secrets.DB_CONNECTION_STRING }}" /TargetFile:database/scripts/output.dacpac

    - name: Commit and Push
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "Auto DB Backup - DACPAC" || echo "No changes"
        git push
